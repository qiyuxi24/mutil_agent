kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "dev.worker"
  domain: dev
  display_name:
    en_us: "Dev Worker"
    zh_cn: "研发 Agent 成员"
  description:
    en_us: "A development agent worker (aggregator/rootcause/fixer/tester/releaser/retrospector)."
    zh_cn: "研发 Agent 成员（聚合/根因/修复/测试/发布/复盘）。"
spec:
  fields:
    - name: id
      type: string
      display_name: { en_us: "ID", zh_cn: "ID" }
      description: { en_us: "Worker identifier/name.", zh_cn: "Worker 标识/名称。" }
    - name: role
      type: string
      display_name: { en_us: "Role", zh_cn: "角色" }
      description: { en_us: "PDCA role (aggregator/rootcause/fixer/tester/releaser/retrospector).", zh_cn: "PDCA 角色。" }
    - name: status
      type: string
      display_name: { en_us: "Status", zh_cn: "状态" }
      description: { en_us: "Worker status (active/busy/idle).", zh_cn: "Worker 状态。" }
    - name: skill_tags
      type: json
      display_name: { en_us: "Skill Tags", zh_cn: "技能标签" }
      description: { en_us: "Attached skill names.", zh_cn: "挂载的技能名。" }
  primary_key_fields:
    - id
  id_generator: "id"
  name_fields:
    - id
  ordered_fields: ["id", "role", "status", "skill_tags"]
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"
