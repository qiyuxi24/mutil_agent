kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "dev.test_case"
  domain: dev
  display_name:
    en_us: "Test Case"
    zh_cn: "测试用例"
  description:
    en_us: "A test case produced by the Tester to verify a fix."
    zh_cn: "由测试验证员产出的用于验证修复的测试用例。"
spec:
  fields:
    - name: id
      type: string
      display_name: { en_us: "ID", zh_cn: "ID" }
      description: { en_us: "Stable test case identifier.", zh_cn: "稳定测试用例标识。" }
    - name: display_name
      type: string
      display_name: { en_us: "Name", zh_cn: "名称" }
      description: { en_us: "Test case name.", zh_cn: "测试用例名称。" }
    - name: scenario
      type: string
      display_name: { en_us: "Scenario", zh_cn: "场景" }
      description: { en_us: "Test scenario / input.", zh_cn: "测试场景/输入。" }
    - name: expected
      type: string
      display_name: { en_us: "Expected", zh_cn: "期望" }
      description: { en_us: "Expected behavior / output.", zh_cn: "期望行为/输出。" }
    - name: coverage
      type: string
      display_name: { en_us: "Coverage", zh_cn: "覆盖" }
      description: { en_us: "Coverage dimension (boundary/exception/regression).", zh_cn: "覆盖维度。" }
  primary_key_fields:
    - id
  id_generator: "id"
  name_fields:
    - display_name
  ordered_fields: ["id", "display_name", "scenario", "coverage"]
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"
