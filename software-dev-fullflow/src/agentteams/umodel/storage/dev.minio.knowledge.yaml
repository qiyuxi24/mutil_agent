kind: minio
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "dev.minio.knowledge"
  domain: dev
  display_name:
    en_us: "MinIO Knowledge Base Store"
    zh_cn: "MinIO 知识库存储"
  description:
    en_us: "S3-compatible object store backing shared/knowledge/ (retrospective + lessons learned)."
    zh_cn: "支撑 shared/knowledge/ 的 S3 兼容对象存储（复盘沉淀 + 经验教训）。"
spec:
  type: minio
  endpoint: "minio.agentteams:9000"
  bucket: "shared"
  prefix: "knowledge"
  access_mode: readwrite
  default_limit: 1000
  max_limit: 10000
  read_only: false
  tls_mode: preferred
  tags:
    role: knowledge-base
    owner: retrospector
