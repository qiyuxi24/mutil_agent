# Team CR（v1.2.0 契约）：【一套完整班子】1 固定 Leader + 10 职能 Worker
# 用途：把「一套完整班子」组织成「软件研发全流程协同」团队。
#       不再有「修复/搭建」两套班子之分（2026-08-16 重构，见 design/TEAM-REFACTOR-SINGLE-BANCHANG.md）。
#       Leader（固定编排者）决定每个阶段从这套班子里挑哪些员工参与。
#       Coordinator（协同路由员）为 Leader 的派发契约层（2026-08-31 新增，借鉴 oil-oil codex-team-mode）。
# 用法（controller 容器内）：
#   docker cp team-rnd.yaml agentteams-controller:/tmp/team-rnd.yaml
#   docker exec agentteams-controller agt apply -f /tmp/team-rnd.yaml
# 前置：
#   1. leader Worker CR 必须先创建（见 src/agentteams/workers.yaml）
#   2. aggregator/rootcause/frontend/backend/fixer/tester/releaser/retrospector/doc-manager/coordinator 十个 Worker CR 已存在
# 校验：workerMembers 必须恰好 1 个 role=team_leader（CRD 强制，否则失败）

apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: rnd-team
spec:
  description: 软件研发全流程协同团队（1 固定 Leader + 10 职能 Worker，一套完整班子）
  teamName: rnd-team
  peerMentions: true
  heartbeatEvery: 30m
  workerMembers:
    - { name: leader,        role: team_leader }
    - { name: aggregator,    role: worker }
    - { name: rootcause,     role: worker }
    - { name: frontend,      role: worker }
    - { name: backend,       role: worker }
    - { name: fixer,         role: worker }
    - { name: tester,        role: worker }
    - { name: releaser,      role: worker }
    - { name: retrospector,  role: worker }
    - { name: doc-manager,   role: worker }
    - { name: coordinator,   role: worker }
