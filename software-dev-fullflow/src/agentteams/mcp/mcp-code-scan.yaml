# ============================================================
# MCP Server 模板：团队自建「代码扫描」REST API → MCP 工具
# 对齐官方 mcp-github.yaml 格式（Higress 网关用）
# 用法：bash setup-mcp-server.sh code-scan "<YOUR_API_KEY>" --yaml-file mcp-code-scan.yaml --api-domain api.scan.example.com
# 说明：
#   - server.config.accessToken 是统一凭据 key，脚本会替换为真实 key
#   - tools[].requestTemplate 支持 Go template：{{.args.xxx}}、{{.config.xxx}}、{{.args.x | b64enc}} 等
#   - 每个 tool 对应一个 REST 调用（method/url/body/headers）
#   - 凭据通过 {{.config.accessToken}} 注入 header，Worker 看不到真实 key
# 复制此文件为 mcp-<你的工具名>.yaml，改 tools 即可接入新工具链
# ============================================================

server:
  name: code-scan-mcp-server
  config:
    accessToken: ""

tools:
- name: start_scan
  description: 提交一次代码扫描任务，返回扫描任务 ID（异步）
  args:
  - name: repo
    type: string
    required: true
    description: "仓库名，如 org/repo"
  - name: branch
    type: string
    required: false
    description: "要扫描的分支，默认 main"
  requestTemplate:
    url: "https://api.scan.example.com/v1/scans?repo={{.args.repo}}&branch={{.args.branch | default \"main\"}}"
    method: POST
    body: |
      {
        "repo": "{{.args.repo}}",
        "branch": "{{.args.branch}}"
      }
    headers:
    - key: Authorization
      value: "Bearer {{.config.accessToken}}"
    - key: Content-Type
      value: "application/json"

- name: get_scan_result
  description: 查询指定代码扫描任务的执行结果与问题清单
  args:
  - name: scan_id
    type: string
    required: true
    description: "扫描任务 ID（来自 start_scan）"
  requestTemplate:
    url: "https://api.scan.example.com/v1/scans/{{.args.scan_id}}"
    method: GET
    headers:
    - key: Authorization
      value: "Bearer {{.config.accessToken}}"

- name: list_open_issues
  description: 列出指定仓库当前未关闭的代码扫描问题
  args:
  - name: repo
    type: string
    required: true
    description: "仓库名，如 org/repo"
  - name: severity
    type: string
    required: false
    description: "按严重级别过滤：critical|high|medium|low"
  requestTemplate:
    url: "https://api.scan.example.com/v1/issues?repo={{.args.repo}}&severity={{.args.severity}}"
    method: GET
    headers:
    - key: Authorization
      value: "Bearer {{.config.accessToken}}"

- name: get_issue_detail
  description: 获取单个代码扫描问题的详情（含代码位置、建议修复）
  args:
  - name: issue_id
    type: string
    required: true
    description: "问题 ID"
  requestTemplate:
    url: "https://api.scan.example.com/v1/issues/{{.args.issue_id}}"
    method: GET
    headers:
    - key: Authorization
      value: "Bearer {{.config.accessToken}}"

# ============================================================
# 常用 Go template 语法速查（对齐官方 mcp-github.yaml）
#   {{.args.<name>}}                 工具参数
#   {{.config.accessToken}}          网关存储的凭据
#   {{.args.content | b64enc}}       base64 编码（上传文件类）
#   {{.args.x | default "val"}}      缺省值
#   method: GET|POST|PUT|DELETE|PATCH
#   url/body/headers 可自由组合
# 注意：路径参数直接拼在 url，body 用 JSON；凭据统一走 header
# ============================================================
