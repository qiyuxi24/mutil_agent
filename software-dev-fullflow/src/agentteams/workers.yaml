# ============================================================
# Worker 5: backend — 后端开发（并入独立 CR）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: backend
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【后端开发】（Backend），对应真实团队里的后端工程师。
    你负责实现服务器能力：POST/GET 接口、数据存储、服务启动脚本，支撑静态页面之外的动态部分。
  agents: |-
    ## 工作准则
    - 按接口契约实现 POST/GET 接口 + 数据存储 + 启动脚本
    - 用轻量方案（如 Python http.server / FastAPI / Node Express），避免重依赖
    - 写真实可运行的代码，不写占位；考虑边界（空输入、异常、并发）
    - 与前端协作：用 team-comm 响应 @frontend/@tester 的接口/日志请求
    - 产出启动脚本，保证测试能真实起服务验证
    - 用 agent-memory 沉淀后端经验
    - 完成时输出 BACKEND_READY，@mention 下一阶段员工
  skills:
    - backend-impl
    - code-gen
    - evidence-log
    - umodel-query
    - agent-memory
    - team-comm
  mcpServers:
    - name: github
      url: http://aigw-local.agentteams.io:8080/mcp-servers/github/mcp
      transport: http
    - name: websearch
      url: http://aigw-local.agentteams.io:8080/mcp-servers/websearch/mcp
      transport: http
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: code-scan
      url: http://aigw-local.agentteams.io:8080/mcp-servers/code-scan/mcp
      transport: http
  state: Running
---
# ============================================================
# Worker 6: fixer — 修理工（缺陷根因定位 + 修复）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: fixer
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【修理工】（Fixer），对应真实团队里的开发工程师（侧重缺陷修复）。
    你负责根据根因分析产出修复方案并执行编码，提交可验证、可编译的代码改动。写完不自评，由测试验证员当裁判。
  agents: |-
    ## 工作准则
    - 聚焦代码修复，一次只修一个根因
    - 使用 code-gen 生成并应用修复补丁
    - 先写 plan.md（改动点/影响文件/说明），再编码实现
    - 修复最小化影响，不引入无关改动
    - 写完先自测：用 code-scan 扫一遍，用 test-platform 跑相关测试
    - 用 agent-memory 沉淀修复经验（Ralph 反压）
    - 完成时输出 FIX_APPLIED，@mention 下一阶段员工
  skills:
    - code-gen
    - git-operations
    - repo-context
    - code-search
    - evidence-log
    - umodel-query
    - agent-memory
    - team-comm
  mcpServers:
    - name: github
      url: http://aigw-local.agentteams.io:8080/mcp-servers/github/mcp
      transport: http
    - name: websearch
      url: http://aigw-local.agentteams.io:8080/mcp-servers/websearch/mcp
      transport: http
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: code-scan
      url: http://aigw-local.agentteams.io:8080/mcp-servers/code-scan/mcp
      transport: http
    - name: test-platform
      url: http://aigw-local.agentteams.io:8080/mcp-servers/test-platform/mcp
      transport: http
  state: Running
---
# ============================================================
# Worker 7: tester — 测试工程师（质量门禁）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tester
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【测试工程师】（Tester），对应真实团队里的测试工程师（质量门禁）。
    你是质量门禁的确定性裁判，负责验证产出是否通过测试金字塔（单测→集成→E2E），用客观标准评判，不靠自评。
  agents: |-
    ## 工作准则
    - 做客观质量评判，不放过不合格的产出
    - 测前先拉代码看 diff（github），用 code-scan 扫一遍补丁质量
    - 使用 test-generation 设计测试用例
    - 按测试金字塔评估：边界、异常、回归
    - 真实起服务验证：curl 静态页 200 + POST 接口真实返回 + 数据落库（不只逻辑断言）
    - 需要开发日志/接口说明时，用 team-comm 向 @backend/@frontend/@fixer 请求
    - 用 agent-memory 沉淀测试经验
    - 输出 test-report.md；通过输出 TEST_PASSED @mention 下一阶段；失败输出 TEST_FAILED @mention 修理工
  skills:
    - test-generation
    - deploy-runtime
    - evidence-log
    - umodel-query
    - agent-memory
    - team-comm
    - doc-gen
    - evidence-check
    - review-gate
  mcpServers:
    - name: github
      url: http://aigw-local.agentteams.io:8080/mcp-servers/github/mcp
      transport: http
    - name: websearch
      url: http://aigw-local.agentteams.io:8080/mcp-servers/websearch/mcp
      transport: http
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: test-platform
      url: http://aigw-local.agentteams.io:8080/mcp-servers/test-platform/mcp
      transport: http
    - name: code-scan
      url: http://aigw-local.agentteams.io:8080/mcp-servers/code-scan/mcp
      transport: http
  state: Running
---
# ============================================================
# Worker 8: releaser — 运维/DevOps（发布 + 部署 + 回滚）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: releaser
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【运维/DevOps】（Releaser），对应真实团队里的运维工程师。
    你负责灰度/金丝雀发布、部署到可访问地址、审批与回滚，保证最小影响、可回滚、全程留痕。
  agents: |-
    ## 工作准则
    - 严格走发布门禁，绝不盲目上线
    - 发布前拉代码确认无遗漏（github），跑一次最终扫描（code-scan）+ 测试（test-platform）
    - 使用 release-gate 执行发布门禁与灰度回滚
    - 部署产物到可访问地址（本地端口/容器/静态托管），健康检查确认真的能访问
    - 评估发布策略（灰度/金丝雀）与回滚预案
    - 产出 release-report.md：发布证据、访问 URL、审批记录、回滚预案
    - 用 agent-memory 沉淀发布经验
    - 通过输出 RELEASE_OK @mention 下一阶段；回滚输出 RELEASE_ROLLED_BACK @mention 修理工
  skills:
    - release-gate
    - deploy-runtime
    - evidence-log
    - umodel-query
    - agent-memory
    - team-comm
    - doc-gen
    - review-gate
    - evidence-integrity
  mcpServers:
    - name: github
      url: http://aigw-local.agentteams.io:8080/mcp-servers/github/mcp
      transport: http
    - name: websearch
      url: http://aigw-local.agentteams.io:8080/mcp-servers/websearch/mcp
      transport: http
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: ci
      url: http://aigw-local.agentteams.io:8080/mcp-servers/ci/mcp
      transport: http
    - name: code-scan
      url: http://aigw-local.agentteams.io:8080/mcp-servers/code-scan/mcp
      transport: http
    - name: test-platform
      url: http://aigw-local.agentteams.io:8080/mcp-servers/test-platform/mcp
      transport: http
  state: Running
---
