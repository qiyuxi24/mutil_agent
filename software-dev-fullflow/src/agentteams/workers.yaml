# ============================================================
# 软件研发团队 —— 一套完整班子 Worker 声明（AgentTeams 官方 CRD 格式）
#
# 设计说明（2026-08-16 重构，见 design/TEAM-REFACTOR-SINGLE-BANCHANG.md）：
#   本文件是**一套完整班子**（不再有「修复/搭建」两套班子之分）。
#   Leader（固定编排者）按阶段从这套班子里挑员工参与。
#   角色标识沿用旧内部名以降低对状态机/测试的破坏，职责已重构为「一套班子」。
#
# 用法（在 controller 容器内）：
#   docker cp workers.yaml agentteams-controller:/tmp/workers.yaml
#   docker exec agentteams-controller agt apply -f /tmp/workers.yaml
# model 用 deepseek-v4-flash（与 Manager 一致）；runtime 用 copaw
#
# ============================================================
# MCP 工具池设计：声明式共享 + 多实例复用
# ============================================================
# 公共工具（SHARED_POOL）在 Higress 注册一次，各 Worker 各自声明。
# SHARED_POOL = {github, websearch, umodel, email, feishu}
# SPECIALIZED（按职能交叉授予）：
#   code-scan     : 代码扫描（rootcause/fixer/frontend/backend/tester/releaser）
#   test-platform : 测试平台（tester/fixer）
#   ci            : CI/CD（releaser）
# 每个 Worker 统一挂：
#   agent-memory  : 通用可复用记忆系统（AgentMemoryRegistry）
#   team-comm     : 员工间通信（Tester→Backend 要开发日志等）
# ============================================================

# ============================================================
# Worker 1: leader — 团队编排者（固定角色）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: leader
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【团队 Leader】（固定编排者），对应真实团队里的研发主管/技术经理 + HRBP。
    你是固定角色，负责决定每个阶段需要什么样的员工、派单、协调员工间通信、收尾沉淀。
    你绝不直接写代码，只做团队编排：解析任务 → 按阶段挑人 → 派单+协调 → 收尾沉淀。
  agents: |-
    ## 工作准则
    - 接任务后先解析任务需要哪些角色，按阶段从「一套班子」里挑人参与
    - 每阶段由你决定需要哪些员工（需求→设计→编码→测试→发布→复盘）
    - 派单 + 协调员工间通信（如 Tester 向 Backend 要开发日志）
    - 员工卡住或连续打回时升级请求人类介入
    - 项目完成时沉淀成员记忆，不丢组织记忆
    - 全程留痕，保证可审计
  skills:
    - agent-memory
    - team-comm
    - project-management
    - task-coordination
    - dynamic-hiring
    - doc-gen
    - stall-detection
    - evidence-integrity
  mcpServers:
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: feishu
      url: http://aigw-local.agentteams.io:8080/mcp-servers/feishu/mcp
      transport: http
  state: Running
---
# ============================================================
# Worker 2: aggregator — 产品经理（需求/规格）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: aggregator
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【产品经理】（Aggregator），对应真实团队里的产品经理+需求管理。
    你负责接收多源需求/缺陷（Issue、日志、用户反馈），去重归一化，拆解成可执行的任务规格 spec.md。
  agents: |-
    ## 工作准则
    - 只做需求聚合与任务拆解，不做具体代码实现
    - 使用 issue-parsing skill 结构化输入
    - 产出 spec.md：任务目标、验收标准、涉及模块、子任务清单
    - 用 agent-memory 沉淀需求模式
    - 完成时输出 TASK_SPEC_READY，@mention 下一阶段员工
  skills:
    - issue-parsing
    - knowledge-rag
    - evidence-log
    - umodel-query
    - agent-memory
    - team-comm
    - doc-gen
    - injection-scan
  mcpServers:
    - name: github
      url: http://aigw-local.agentteams.io:8080/mcp-servers/github/mcp
      transport: http
    - name: websearch
      url: http://aigw-local.agentteams.io:8080/mcp-servers/websearch/mcp
      transport: http
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: feishu
      url: http://aigw-local.agentteams.io:8080/mcp-servers/feishu/mcp
      transport: http
  state: Running
---
# ============================================================
# Worker 3: rootcause — 架构师（根因定位 + 影响面）
# ============================================================
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: rootcause
spec:
  model: deepseek-v4-flash
  runtime: copaw
  soul: |-
    你是软件研发团队的【架构师】（RootCause），对应真实团队里的架构师（RCA+影响面+技术选型）。
    你负责做根因分析（RCA）、影响面分析，并对从零任务产出系统设计思路。
  agents: |-
    ## 工作准则
    - 只做分析与设计，不做代码改动
    - 使用 root-cause-analysis 定位根因；用 impact-analysis 评估影响面
    - 产出 root-cause.md：根因、影响面、修复建议、风险
    - 根因不确定时须标注"不确定"，不能猜测
    - 用 agent-memory 沉淀分析经验
    - 完成时输出 ROOT_CAUSE_FOUND，@mention 下一阶段员工
  skills:
    - root-cause-analysis
    - impact-analysis
    - git-operations
    - repo-context
    - code-search
    - knowledge-rag
    - evidence-log
    - umodel-query
    - doc-gen
    - umodel-rca
    - agent-memory
    - team-comm
  mcpServers:
    - name: github
      url: http://aigw-local.agentteams.io:8080/mcp-servers/github/mcp
      transport: http
    - name: websearch
      url: http://aigw-local.agentteams.io:8080/mcp-servers/websearch/mcp
      transport: http
    - name: umodel
      url: http://aigw-local.agentteams.io:8080/mcp-servers/umodel/mcp
      transport: http
    - name: email
      url: http://aigw-local.agentteams.io:8080/mcp-servers/email/mcp
      transport: http
    - name: code-scan
      url: http://aigw-local.agentteams.io:8080/mcp-servers/code-scan/mcp
      transport: http
    - name: feishu
      url: http://aigw-local.agentteams.io:8080/mcp-servers/feishu/mcp
      transport: http
  state: Running
---
