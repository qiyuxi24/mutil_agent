[pytest]
# pytest 配置文件 —— 软件研发全流程协同 Agent 系统

# 测试路径
testpaths = tests

# Python 路径（src/ 为 loop 包根目录）
pythonpath = src

# 最小 pytest 版本
minversion = 8.0

# 测试发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:warnings

# 自定义标记
markers =
    slow: 标记运行较慢的测试（deselect with '-m "not slow"'）
    e2e: 端到端测试标记
    api: API 契约测试标记
    cli: CLI 管道测试标记
    browser: 浏览器端到端测试（需 Playwright）
    smoke: 冒烟测试标记
    integration: 集成测试标记
    unit: 单元测试标记
    asyncio: 异步测试标记（pytest-asyncio）

# 覆盖率配置（配合 pytest-cov 使用）
# --cov=src/loop --cov=src/agentteams --cov-report=html --cov-report=term

# 忽略目录
norecursedirs = .git .venv demo/.venv references __pycache__ node_modules

# 超时（需 pytest-timeout 插件）
# timeout = 300
# timeout_method = signal