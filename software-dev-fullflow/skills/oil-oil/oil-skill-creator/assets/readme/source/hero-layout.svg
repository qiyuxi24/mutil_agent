<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">oil-skill-creator</title>
  <desc id="desc">像做产品一样写 Skill：先判断价值，固化流程，再用真实结果验证。</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#171717" stroke-width="1" opacity="0.055"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#171717" opacity="0.18"/>
    </pattern>
    <clipPath id="hero-bounds">
      <rect x="10" y="10" width="1180" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-bounds)">
    <rect width="1200" height="420" fill="#FBFAF4"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="90" cy="36" r="206" fill="#FFFFFF" opacity="0.58"/>

    <path d="M691 58C771 22 918 22 1038 61C1146 96 1184 190 1149 281C1111 379 978 408 844 382C718 357 638 282 646 184C650 128 663 85 691 58Z"
          fill="#F4CA5F" opacity="0.86"/>
    <path d="M1053 64H1151V162H1053Z" fill="url(#dots)" opacity="0.82"/>
    <path d="M704 335C786 366 884 373 985 350C1055 334 1115 303 1160 260"
          fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
    <path d="M535 34V386" stroke="#171717" stroke-width="2" opacity="0.1"/>

    <g id="title-block" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
      <text x="56" y="62" fill="#74726C" font-size="17" font-weight="720" letter-spacing="2.6">DESIGN · REVIEW · REMEDIATE · SHIP</text>
      <text x="52" y="140" fill="#171717" font-size="60" font-weight="820" letter-spacing="-2.5">oil-skill-creator</text>
      <path d="M54 157C162 153 305 154 462 158" fill="none" stroke="#F4CA5F" stroke-width="16" stroke-linecap="square" opacity="0.88"/>

      <text x="56" y="218" fill="#171717" font-size="32" font-weight="760">像做产品一样写 Skill</text>
      <text x="56" y="258" fill="#65645F" font-size="20" font-weight="510">先判断它是否值得做，再把稳定步骤交给程序。</text>
      <text x="56" y="290" fill="#65645F" font-size="20" font-weight="510">效果不好时，回到流程和证据，而不是继续堆规则。</text>

      <g id="process" transform="translate(58 333)"
         font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
         font-size="15" font-weight="760">
        <path d="M9 10H404" fill="none" stroke="#171717" stroke-width="2" opacity="0.22"/>
        <circle cx="9" cy="10" r="8" fill="#171717"/>
        <circle cx="142" cy="10" r="8" fill="#DCE8F5" stroke="#171717" stroke-width="2"/>
        <circle cx="274" cy="10" r="8" fill="#E7DCF6" stroke="#171717" stroke-width="2"/>
        <circle cx="404" cy="10" r="8" fill="#E0EFE1" stroke="#171717" stroke-width="2"/>
        <text x="0" y="43" fill="#171717">VALUE</text>
        <text x="118" y="43" fill="#171717">FLOW</text>
        <text x="237" y="43" fill="#171717">EVIDENCE</text>
        <text x="384" y="43" fill="#171717">SHIP</text>
      </g>
    </g>

    <rect id="subject-slot" x="548" y="18" width="632" height="390" fill="none"/>
  </g>

  <rect x="10" y="10" width="1180" height="400" rx="28" fill="none" stroke="#CAC6BC" stroke-width="2"/>
</svg>
